name: Build and Deploy CELC Website

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Verify build output
        run: ls -la .next/server/app/ && find .next/server/app -maxdepth 2 -type f | head -20

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: ./.next
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

      - name: Upload public assets
        uses: actions/upload-artifact@v4
        with:
          name: public-assets
          path: ./public
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true
